name: monitool
region: fra

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

databases:
  - name: monitool-postgres
    engine: PG
    production: true
    cluster_name: monitool-postgres
  - name: monitool-redis
    engine: VALKEY
    production: true
    cluster_name: monitool-redis

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: fun4life1990/monitool-api
      branch: main
      deploy_on_push: true
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /up
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 9
    envs:
      - {key: APP_NAME,                  value: "Monitool",                            scope: RUN_AND_BUILD_TIME}
      - {key: APP_ENV,                   value: "production",                          scope: RUN_AND_BUILD_TIME}
      - {key: APP_DEBUG,                 value: "false",                               scope: RUN_AND_BUILD_TIME}
      - {key: APP_KEY,                   value: "__APP_KEY__",                         scope: RUN_TIME,  type: SECRET}
      - {key: APP_URL,                   value: "${APP_URL}",                          scope: RUN_TIME}
      - {key: LOG_CHANNEL,               value: "stderr",                              scope: RUN_TIME}
      - {key: LOG_LEVEL,                 value: "info",                                scope: RUN_TIME}
      - {key: DB_CONNECTION,             value: "pgsql",                               scope: RUN_TIME}
      - {key: DB_HOST,                   value: "${monitool-postgres.HOSTNAME}",       scope: RUN_TIME}
      - {key: DB_PORT,                   value: "${monitool-postgres.PORT}",           scope: RUN_TIME}
      - {key: DB_DATABASE,               value: "${monitool-postgres.DATABASE}",       scope: RUN_TIME}
      - {key: DB_USERNAME,               value: "${monitool-postgres.USERNAME}",       scope: RUN_TIME}
      - {key: DB_PASSWORD,               value: "${monitool-postgres.PASSWORD}",       scope: RUN_TIME,  type: SECRET}
      - {key: DB_SSLMODE,                value: "require",                             scope: RUN_TIME}
      - {key: REDIS_CLIENT,              value: "phpredis",                            scope: RUN_TIME}
      - {key: REDIS_URL,                 value: "${monitool-redis.DATABASE_URL}",      scope: RUN_TIME,  type: SECRET}
      - {key: SESSION_DRIVER,            value: "redis",                               scope: RUN_TIME}
      - {key: CACHE_STORE,               value: "redis",                               scope: RUN_TIME}
      - {key: QUEUE_CONNECTION,          value: "redis",                               scope: RUN_TIME}
      - {key: SWAGGER_ENABLE,            value: "true",                                scope: RUN_TIME}
      - {key: HORIZON_AUTH_COOKIE_NAME,  value: "monitool-horizon",                    scope: RUN_TIME}
      - {key: HORIZON_AUTH_COOKIE_VALUE, value: "__HORIZON_COOKIE__",                  scope: RUN_TIME,  type: SECRET}
      - {key: CORS_ALLOWED_ORIGINS,      value: "*",                                   scope: RUN_TIME}
      - {key: MAIL_MAILER,               value: "log",                                 scope: RUN_TIME}
    routes:
      - path: /

workers:
  - name: horizon
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: fun4life1990/monitool-api
      branch: main
      deploy_on_push: true
    instance_size_slug: basic-xxs
    instance_count: 1
    run_command: php artisan horizon
    envs:
      - {key: APP_NAME,                  value: "Monitool",                            scope: RUN_AND_BUILD_TIME}
      - {key: APP_ENV,                   value: "production",                          scope: RUN_AND_BUILD_TIME}
      - {key: APP_DEBUG,                 value: "false",                               scope: RUN_AND_BUILD_TIME}
      - {key: APP_KEY,                   value: "__APP_KEY__",                         scope: RUN_TIME,  type: SECRET}
      - {key: APP_URL,                   value: "${APP_URL}",                          scope: RUN_TIME}
      - {key: LOG_CHANNEL,               value: "stderr",                              scope: RUN_TIME}
      - {key: LOG_LEVEL,                 value: "info",                                scope: RUN_TIME}
      - {key: DB_CONNECTION,             value: "pgsql",                               scope: RUN_TIME}
      - {key: DB_HOST,                   value: "${monitool-postgres.HOSTNAME}",       scope: RUN_TIME}
      - {key: DB_PORT,                   value: "${monitool-postgres.PORT}",           scope: RUN_TIME}
      - {key: DB_DATABASE,               value: "${monitool-postgres.DATABASE}",       scope: RUN_TIME}
      - {key: DB_USERNAME,               value: "${monitool-postgres.USERNAME}",       scope: RUN_TIME}
      - {key: DB_PASSWORD,               value: "${monitool-postgres.PASSWORD}",       scope: RUN_TIME,  type: SECRET}
      - {key: DB_SSLMODE,                value: "require",                             scope: RUN_TIME}
      - {key: REDIS_CLIENT,              value: "phpredis",                            scope: RUN_TIME}
      - {key: REDIS_URL,                 value: "${monitool-redis.DATABASE_URL}",      scope: RUN_TIME,  type: SECRET}
      - {key: SESSION_DRIVER,            value: "redis",                               scope: RUN_TIME}
      - {key: CACHE_STORE,               value: "redis",                               scope: RUN_TIME}
      - {key: QUEUE_CONNECTION,          value: "redis",                               scope: RUN_TIME}
      - {key: HORIZON_AUTH_COOKIE_NAME,  value: "monitool-horizon",                    scope: RUN_TIME}
      - {key: HORIZON_AUTH_COOKIE_VALUE, value: "__HORIZON_COOKIE__",                  scope: RUN_TIME,  type: SECRET}
      - {key: MAIL_MAILER,               value: "log",                                 scope: RUN_TIME}

  - name: scheduler
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: fun4life1990/monitool-api
      branch: main
      deploy_on_push: true
    instance_size_slug: basic-xxs
    instance_count: 1
    run_command: php artisan schedule:work
    envs:
      - {key: APP_NAME,                  value: "Monitool",                            scope: RUN_AND_BUILD_TIME}
      - {key: APP_ENV,                   value: "production",                          scope: RUN_AND_BUILD_TIME}
      - {key: APP_DEBUG,                 value: "false",                               scope: RUN_AND_BUILD_TIME}
      - {key: APP_KEY,                   value: "__APP_KEY__",                         scope: RUN_TIME,  type: SECRET}
      - {key: APP_URL,                   value: "${APP_URL}",                          scope: RUN_TIME}
      - {key: LOG_CHANNEL,               value: "stderr",                              scope: RUN_TIME}
      - {key: LOG_LEVEL,                 value: "info",                                scope: RUN_TIME}
      - {key: DB_CONNECTION,             value: "pgsql",                               scope: RUN_TIME}
      - {key: DB_HOST,                   value: "${monitool-postgres.HOSTNAME}",       scope: RUN_TIME}
      - {key: DB_PORT,                   value: "${monitool-postgres.PORT}",           scope: RUN_TIME}
      - {key: DB_DATABASE,               value: "${monitool-postgres.DATABASE}",       scope: RUN_TIME}
      - {key: DB_USERNAME,               value: "${monitool-postgres.USERNAME}",       scope: RUN_TIME}
      - {key: DB_PASSWORD,               value: "${monitool-postgres.PASSWORD}",       scope: RUN_TIME,  type: SECRET}
      - {key: DB_SSLMODE,                value: "require",                             scope: RUN_TIME}
      - {key: REDIS_CLIENT,              value: "phpredis",                            scope: RUN_TIME}
      - {key: REDIS_URL,                 value: "${monitool-redis.DATABASE_URL}",      scope: RUN_TIME,  type: SECRET}
      - {key: SESSION_DRIVER,            value: "redis",                               scope: RUN_TIME}
      - {key: CACHE_STORE,               value: "redis",                               scope: RUN_TIME}
      - {key: QUEUE_CONNECTION,          value: "redis",                               scope: RUN_TIME}
      - {key: MAIL_MAILER,               value: "log",                                 scope: RUN_TIME}

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: fun4life1990/monitool-api
      branch: main
      deploy_on_push: true
    instance_size_slug: basic-xxs
    run_command: php artisan migrate --force
    envs:
      - {key: APP_NAME,                  value: "Monitool",                            scope: RUN_AND_BUILD_TIME}
      - {key: APP_ENV,                   value: "production",                          scope: RUN_AND_BUILD_TIME}
      - {key: APP_DEBUG,                 value: "false",                               scope: RUN_AND_BUILD_TIME}
      - {key: APP_KEY,                   value: "__APP_KEY__",                         scope: RUN_TIME,  type: SECRET}
      - {key: LOG_CHANNEL,               value: "stderr",                              scope: RUN_TIME}
      - {key: LOG_LEVEL,                 value: "info",                                scope: RUN_TIME}
      - {key: DB_CONNECTION,             value: "pgsql",                               scope: RUN_TIME}
      - {key: DB_HOST,                   value: "${monitool-postgres.HOSTNAME}",       scope: RUN_TIME}
      - {key: DB_PORT,                   value: "${monitool-postgres.PORT}",           scope: RUN_TIME}
      - {key: DB_DATABASE,               value: "${monitool-postgres.DATABASE}",       scope: RUN_TIME}
      - {key: DB_USERNAME,               value: "${monitool-postgres.USERNAME}",       scope: RUN_TIME}
      - {key: DB_PASSWORD,               value: "${monitool-postgres.PASSWORD}",       scope: RUN_TIME,  type: SECRET}
      - {key: DB_SSLMODE,                value: "require",                             scope: RUN_TIME}
      - {key: REDIS_CLIENT,              value: "phpredis",                            scope: RUN_TIME}
      - {key: REDIS_URL,                 value: "${monitool-redis.DATABASE_URL}",      scope: RUN_TIME,  type: SECRET}
      - {key: SESSION_DRIVER,            value: "redis",                               scope: RUN_TIME}
      - {key: CACHE_STORE,               value: "redis",                               scope: RUN_TIME}
      - {key: QUEUE_CONNECTION,          value: "redis",                               scope: RUN_TIME}

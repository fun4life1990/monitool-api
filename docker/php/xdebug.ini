; XDebug — debug capability is on by default; client_host/port/idekey come
; from XDEBUG_CONFIG / PHP_IDE_CONFIG envs at runtime (compose passes them).
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.idekey = PHPSTORM
xdebug.discover_client_host = 0
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log_level = 0

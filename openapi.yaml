openapi: 3.0.3

info:
  title: Monitool API
  version: 0.1.0
  description: |
    Admin API for automated monitoring of domain availability.
    Authentication is Bearer token (Laravel Sanctum) issued by `/auth/login` or `/auth/register`.
  contact:
    name: Monitool

servers:
  - url: http://localhost:8080

tags:
  - name: Auth
  - name: Domains
  - name: Checks

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      security:
        - sanctum: []
      responses:
        '204':
          description: Token revoked
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      security:
        - sanctum: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/domains:
    get:
      tags: [Domains]
      summary: List the authenticated user's domains
      security:
        - sanctum: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated list of domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDomains'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Domains]
      summary: Create a new domain to monitor
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainInput'
      responses:
        '201':
          description: Domain created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/domains/{domain}:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    get:
      tags: [Domains]
      summary: Get a single domain
      security:
        - sanctum: []
      responses:
        '200':
          description: Domain
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Domains]
      summary: Update a domain (partial)
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainInput'
      responses:
        '200':
          description: Updated domain
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Domains]
      summary: Replace a domain (full update)
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainInput'
      responses:
        '200':
          description: Updated domain
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Domains]
      summary: Delete a domain
      security:
        - sanctum: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/domains/{domain}/checks:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    get:
      tags: [Checks]
      summary: List check history for a domain (most recent first)
      security:
        - sanctum: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated check history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDomainChecks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer

  parameters:
    DomainId:
      in: path
      name: domain
      required: true
      schema:
        type: integer
        format: int64

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authorization failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Sanctum bearer token (plain text — store securely)
        user:
          $ref: '#/components/schemas/User'

    DomainInput:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 255
        url:
          type: string
          format: uri
          maxLength: 2048
        method:
          type: string
          enum: [GET, HEAD]
          default: GET
        interval_seconds:
          type: integer
          minimum: 60
          maximum: 86400
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 30000
        notify_email:
          type: string
          format: email
          nullable: true
        is_active:
          type: boolean
      required: [url]

    Domain:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        method:
          type: string
          enum: [GET, HEAD]
        interval_seconds:
          type: integer
        timeout_ms:
          type: integer
        notify_email:
          type: string
          format: email
          nullable: true
        is_active:
          type: boolean
        last_status:
          type: string
          enum: [up, down]
          nullable: true
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DomainCheck:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [up, down]
        http_status:
          type: integer
          nullable: true
        response_time_ms:
          type: integer
          nullable: true
        method:
          type: string
          enum: [GET, HEAD]
        error:
          type: string
          nullable: true
        checked_at:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        path:
          type: string
        per_page:
          type: integer
        to:
          type: integer
          nullable: true
        total:
          type: integer

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    PaginatedDomains:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedDomainChecks:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DomainCheck'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
